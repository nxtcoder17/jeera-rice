# Kitty sessions, replacing tmux.

startup_session $HOME/.config/kitty/sessions/home.kitty-session

map ctrl+shift+s launch --type=overlay --title kitty-session-save --allow-remote-control ~/.config/kitty/scripts/kitty-session-save.sh
# map ctrl+shift+r launch --type=overlay --title kitty-session-save --allow-remote-control goto_session ~/.local/share/kitty/sessions
map ctrl+shift+r launch --type=overlay --title kitty-session-save --allow-remote-control ~/.config/kitty/scripts/kitty-session-select.sh

# Only the sessions that are already loaded, for hopping between open ones
# without touching the filesystem.
map ctrl+shift+n goto_session --active-only

# Same picker, but for sessions kitty already knows about from a goto_session
# mapping or a previous load.
map ctrl+a>s goto_session

# Back through session history. Larger negative numbers go further back.
map ctrl+a>w goto_session -1

# Close every window in the current session, for tearing down a project.
map ctrl+a>x close_session .

# Save the current session back over its own file, picking up any splits and
# tabs you added after restoring. A bare "." tells kitty to overwrite the file
# the active session came from, so this needs no name and no prompt.
# Deliberately no --base-dir here: it would redirect "." to a directory and
# make kitty refuse to save.
map f2 save_as_session --save-only --use-foreground-process --match=session:. .

# Make new windows and tabs join the active session instead of becoming
# session-less. Without this, splits created after a restore are invisible to
# the f2 save above.
# map ctrl+a>w new_window_with_cwd
# map ctrl+a>n new_os_window_with_cwd
