nixpkgs:
  default: 050e09e091117c3d7328c7b2b7b577492c43c134
packages:
  - coreutils-full
  - unixtools.whereis
  - which
  - bat
  - less
  - ncurses
  - jq
  - yq
  - curl
  - dust
  - zoxide
  - eza
  - bun
  - nodejs
  - go
  - neovim
  - ripgrep
  - fd
  - fzf
  - fish
on-shell-enter: |
  mkdir -p $HOME/.config

  # echo "nixy-mode  = $NIXY_MODE"
  if [ "$NIXY_MODE" = "colima" ]; then
    ln -sf /tmp/nvim $HOME/.config/
    ln -sf /tmp/fzf $HOME/.config/

    mkdir -p $HOME/.config/fish
    cp -r -s /tmp/fish/* $HOME/.config/fish/
    rm -f $HOME/.config/fish/fish_variables
  fi
mounts:
  - source: $HOME/.config/nvim
    dest: /tmp/nvim
    readonly: true
  - source: $HOME/.config/fish
    dest: /tmp/fish
    readonly: true
  - source: $HOME/.config/fzf
    dest: /tmp/fzf
    readonly: true
